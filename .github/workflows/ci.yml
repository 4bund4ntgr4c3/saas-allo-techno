name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src/
      - run: npx prettier --check src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with client env
        env:
          VITE_SUPABASE_URL: https://fcxmecphvflmbqayyioj.supabase.co
          VITE_SUPABASE_KEY: sb_publishable_7qJ94OD6U7esKSJIsFLOCg_wLjJyQzO
          VITE_SUPABASE_PROJECT_ID: fcxmecphvflmbqayyioj
          VITE_VAPID_PUBLIC_KEY: BHveilvP4wRi-nEp8GqnqQZ5mDldEKW4jnkeqVJHTtsuvc3lbDNbdteB46nRyfjALSqHPlfeWfgJm8Cn6YWBoyI
