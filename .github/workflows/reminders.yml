name: Rappels automatiques (WhatsApp / e-mail)

on:
  schedule:
    # 08:00 UTC = 09:00 heure de Porto-Novo (UTC+1, sans heure d'été).
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler l'API des rappels
        run: >
          curl -sS -X POST
          -H "Authorization: Bearer ${{ secrets.CRON_TOKEN }}"
          -f "https://saas-allo-techno.4bund4ntgr4c3.workers.dev/api/cron-reminders"
