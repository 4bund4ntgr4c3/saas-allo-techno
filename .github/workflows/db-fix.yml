name: TEMP db-fix

on:
  workflow_dispatch:

jobs:
  db-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply missing migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          sudo apt-get install -y postgresql-client
          PW=$(echo "$DATABASE_URL" | sed -E 's|.*://[^:]+:([^@]+)@.*|\1|')
          for R in ams-1 arn-1 ber-1 bos-1 bom-1 cdg-1 del-1 den-1 dfw-1 dub-1 ewr-1 fra-1 gig-1 gru-1 hkg-1 iad-1 jnb-1 lax-1 lhr-1 mad-1 mia-1 mrs-1 nrt-1 ord-1 otp-1 phx-1 qro-1 scl-1 sea-1 sin-1 sjc-1 syd-1 waw-1 yyz-1; do
            URL="postgresql://postgres.fcxmecphvflmbqayyioj:${PW}@fly-0-${R}.pooler.supabase.com:5432/postgres?sslmode=require"
            if PGPASSWORD="$PW" psql "$URL" -c "select 1" >/dev/null 2>&1; then
              echo "CONNECTED via fly-0-${R}"
              psql "$URL" -v ON_ERROR_STOP=1 -f scripts/db-fix-temp.sql
              echo "MIGRATIONS_OK exit=$?"
              exit 0
            fi
            echo "tried ${R}"
          done
          echo "ALL_FLY_REGIONS_FAILED"
          exit 1