name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify bun.lock is in sync with package.json
        run: npx bun install --dry-run 2>&1 | grep -q "lockfile" && echo "⚠️ bun.lock may be out of date — run 'npx bun install' locally and commit bun.lock" || echo "✅ bun.lock is in sync"
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --cwd .output/server
