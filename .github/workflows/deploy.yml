name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify bun.lock is in sync with package.json
        run: npx bun install --dry-run 2>&1 | grep -q "lockfile" && echo "⚠️ bun.lock may be out of date — run 'npx bun install' locally and commit bun.lock" || echo "✅ bun.lock is in sync"
      - name: Build with client env
        env:
          # Publiques par design (expédiées dans le bundle client) — sans elles
          # le client Supabase throw au montage et aucune page ne s'affiche.
          VITE_SUPABASE_URL: https://fcxmecphvflmbqayyioj.supabase.co
          VITE_SUPABASE_KEY: sb_publishable_7qJ94OD6U7esKSJIsFLOCg_wLjJyQzO
          VITE_SUPABASE_PROJECT_ID: fcxmecphvflmbqayyioj
          VITE_VAPID_PUBLIC_KEY: BHveilvP4wRi-nEp8GqnqQZ5mDldEKW4jnkeqVJHTtsuvc3lbDNbdteB46nRyfjALSqHPlfeWfgJm8Cn6YWBoyI
        run: npm run build
      - name: Remove nitro-generated .wrangler config (conflicts with deploy config)
        run: rm -rf .wrangler
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --cwd .output/server
