name: Réinitialisation horaire de la Démo

on:
  schedule:
    # Exécution chaque heure à la minute 0 (00:00, 01:00, 02:00, ...)
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  demo-reset:
    name: Reset & Re-seed Demo Environment
    runs-on: ubuntu-latest
    steps:
      - name: Appeler l'API de réinitialisation de la démo
        run: >
          curl -sS -X POST
          -H "Authorization: Bearer ${{ secrets.CRON_TOKEN }}"
          -f "https://saas-allo-techno.4bund4ntgr4c3.workers.dev/api/cron-demo-reset"
